---
deployment:
  tasks:
    # Run the copy commands together and stop immediately if any command fails.
    - >-
      set -eu;
      export DEPLOYPATH="/home1/oneas336/hub.oneasyloan.com/rex";
      echo "Deploying custom files to: $DEPLOYPATH";
      if [ ! -f "$DEPLOYPATH/wp-config.php" ]; then
      echo "ERROR: wp-config.php not found at $DEPLOYPATH. Check the live WordPress path." >&2;
      exit 1;
      fi;
      /bin/mkdir -p "$DEPLOYPATH/wp-content/themes/uncode-child" "$DEPLOYPATH/rex-3d";
      /bin/cp -R wp-content/themes/uncode-child/. "$DEPLOYPATH/wp-content/themes/uncode-child/";
      echo "Child theme copied.";
      /bin/cp -R rex-3d/. "$DEPLOYPATH/rex-3d/";
      echo "3D files copied. Deployment completed.";
